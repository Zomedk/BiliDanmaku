<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - B站视频分析工具</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div id="login-app" class="login-container">
        <h2 class="login-title">欢迎使用B站分析工具</h2>
        <div class="input-group">
            <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input v-model="username" placeholder="请输入用户名" class="input-field" required>
            </div>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input v-model="password" type="password" placeholder="请输入密码" class="input-field" required>
            </div>
        </div>
        <div class="button-group">
            <button @click="login" class="btn-primary" :disabled="isLoading">
                <span v-if="isLoading" class="loading-spinner"></span>
                {{ isLoading ? '登录中...' : '立即登录' }}
            </button>
            <button @click="register" class="btn-secondary" :disabled="isLoading">
                <span v-if="isLoading" class="loading-spinner"></span>
                {{ isLoading ? '注册中...' : '立即注册' }}
            </button>
        </div>
        <p v-if="error" class="error-message">登录失败：{{ error }}</p>
    </div>
    <script>
        new Vue({
            el: '#login-app',
            data: {
                username: '',
                password: '',
                isLoading: false,
                error: ''
            },
            methods: {
                login() {
                    this.isLoading = true;
                    this.error = '';
                    axios.post('http://127.0.0.1:5000/api/login', {
                        username: this.username,
                        password: this.password
                    })
                    .then(response => {
                        localStorage.setItem('isLoggedIn', 'true');
                        window.location.href = '/index.html';
                    })
                    .catch(error => {
                        this.error = error.response?.data?.error || '请检查用户名或密码';
                    })
                    .finally(() => {
                        this.isLoading = false;
                    });
                },
                register() {
                    this.isLoading = true;
                    this.error = '';
                    axios.post('http://127.0.0.1:5000/api/register', {
                        username: this.username,
                        password: this.password
                    })
                    .then(response => {
                        alert('注册成功，请登录');
                        this.username = '';
                        this.password = '';
                    })
                    .catch(error => {
                        this.error = error.response?.data?.error || '注册失败';
                    })
                    .finally(() => {
                        this.isLoading = false;
                    });
                }
            }
        });
    </script>
</body>
</html>
