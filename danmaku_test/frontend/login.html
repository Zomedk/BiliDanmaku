<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - B站视频分析工具</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-primary {
            padding: 10px 20px;
            background-color: #00a1d6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #0081b3;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="login-app" class="login-container">
        <h2>登录</h2>
        <input v-model="username" placeholder="用户名" class="input-field">
        <input v-model="password" type="password" placeholder="密码" class="input-field">
        <button @click="login" class="btn-primary" :disabled="isLoading">
            {{ isLoading ? '登录中...' : '登录' }}
        </button>
        <button @click="register" class="btn-primary" :disabled="isLoading">
            {{ isLoading ? '注册中...' : '注册' }}
        </button>
        <p v-if="error" class="error">{{ error }}</p>
    </div>
    <script>
        new Vue({
            el: '#login-app',
            data: {
                username: '',
                password: '',
                isLoading: false,
                error: ''
            },
            methods: {
                login() {
                    this.isLoading = true;
                    this.error = '';
                    axios.post('http://127.0.0.1:5000/api/login', {
                        username: this.username,
                        password: this.password
                    })
                    .then(response => {
                        localStorage.setItem('isLoggedIn', 'true');
                        window.location.href = '/index.html';
                    })
                    .catch(error => {
                        this.error = error.response?.data?.error || '登录失败';
                    })
                    .finally(() => {
                        this.isLoading = false;
                    });
                },
                register() {
                    this.isLoading = true;
                    this.error = '';
                    axios.post('http://127.0.0.1:5000/api/register', {
                        username: this.username,
                        password: this.password
                    })
                    .then(response => {
                        alert('注册成功，请登录');
                        this.username = '';
                        this.password = '';
                    })
                    .catch(error => {
                        this.error = error.response?.data?.error || '注册失败';
                    })
                    .finally(() => {
                        this.isLoading = false;
                    });
                }
            }
        });
    </script>
</body>
</html>
